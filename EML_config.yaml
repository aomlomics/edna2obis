  title: "Potential prey of Rice's whales from seawater eDNA metabarcoding (GU19-01)"
  title_source_field: "project_name"
  abstract: |
    This dataset contains marine environmental DNA (eDNA) metabarcoding occurrence records
    generated from seawater samples collected during expedition GU19-01. The package includes
    two fish-targeted 12S assays (MiFish and Riaz) and is intended to support biodiversity
    characterization and potential prey investigations.

