name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches src/_version.py
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); from _version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version in src/_version.py"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v hdr="## [${GITHUB_REF_NAME#v}]" 'index($0, hdr) == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "edna2obis $GITHUB_REF_NAME" --notes-file release_notes.md --verify-tag $prerelease
